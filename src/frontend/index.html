<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cineverse</title>

    <style>

      html, body {
        margin: 0;
        padding: 0;
        background: #0b0f19;
      }

      #app {
        min-height: 100vh;
        background: #0b0f19;
      }

      /* BOOT FULLSCREEN */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at center,
          #141a2b 0%,
          #0f1422 35%,
          #0b0f19 70%,
          #070a12 100%
        );
        transition: opacity .4s ease;
      }

      .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ff2a7f;
        position: relative;

        box-shadow:
          0 0 10px rgba(255, 42, 127, 0.8),
          0 0 25px rgba(255, 42, 127, 0.6),
          0 0 60px rgba(255, 42, 127, 0.3);

        animation: pulse 1.1s ease-in-out infinite;
      }

      .dot::after {
        content: "";
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        border: 2px solid rgba(255, 42, 127, 0.25);
        animation: ripple 1.4s ease-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.4); opacity: 1; }
      }

      @keyframes ripple {
        0% { transform: scale(0.6); opacity: 0.6; }
        100% { transform: scale(1.8); opacity: 0; }
      }

    </style>
    
  </head>

  <body>

    <div id="boot">
      <div class="dot"></div>
    </div>

    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>

    <script>
      // esperamos a que carguen todos los recursos (incluyendo imágenes, CSS, etc.)
      window.onload = () => {
        const boot = document.getElementById("boot");

        // hace desaparecer el loader (“boot”) con animación
        // permite que el loader se vea un mínimo
        // evita que desaparezca instantáneo si la app carga muy rápido
        setTimeout(() => {
          if (!boot) return;

          // empieza animación
          boot.style.opacity = "0";

          // espera a que termine la animación CSS 
          setTimeout(() => {
            boot.remove();
          }, 400);

        }, 300);
      };
    </script>

  </body>
</html>
